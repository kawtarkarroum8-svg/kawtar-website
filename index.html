<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawtar | Cloud & DevOps Engineer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --sub-text: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            padding: 40px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--sub-text);
            margin-bottom: 30px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .skill-card {
            background-color: #334155;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            color: var(--text-color);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .skill-card:hover {
            transform: translateY(-5px);
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .status-badge {
            display: inline-block;
            margin-top: 30px;
            padding: 8px 16px;
            background-color: #0284c7;
            color: #fff;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Kawtar</h1>
        <p class="subtitle">Cloud & DevOps Engineer Portfolio</p>
        <p>Welcome to my automated AWS static portfolio hosted via S3 & GitHub Actions CI/CD pipeline.</p>

        <div class="skills-grid">
            <div class="skill-card">AWS</div>
            <div class="skill-card">Terraform</div>
            <div class="skill-card">Docker</div>
            <div class="skill-card">Kubernetes</div>
            <div class="skill-card">GitHub Actions</div>
            <div class="skill-card">Linux</div>
        </div>

        <div class="status-badge">🚀 Deployed Automatically via GitHub Actions</div>
    </div>

</body>
</html>
